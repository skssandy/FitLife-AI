name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Upload APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create secrets.properties from GitHub Secrets
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > secrets.properties

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Get version info
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/.*\([0-9]\+\).*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT

      - name: Generate QR Code
        run: |
          sudo apt-get install -y qrencode
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/latest/download/FitLife-${{ steps.version.outputs.version }}.apk"
          qrencode -o qr-code.png -s 10 -m 2 "$DOWNLOAD_URL"
          echo "QR code generated for: $DOWNLOAD_URL"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FitLife-debug-v${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FitLife-release-v${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload QR Code
        uses: actions/upload-artifact@v4
        with:
          name: FitLife-qr-code
          path: qr-code.png

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: FitLife v${{ steps.version.outputs.version }}
          body: |
            ## FitLife AI v${{ steps.version.outputs.version }}

            ### Installation
            1. Download the APK below
            2. Enable "Install from unknown sources" on your device
            3. Open the APK to install
            4. Scan the QR code for direct download

            ### What's New
            - Native Android with Jetpack Compose
            - AI-powered coaching with Gemini 2.0 Flash
            - Health Connect integration
            - Background sync with WorkManager
          files: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/debug/app-debug.apk
            qr-code.png
          draft: false
          prerelease: false
